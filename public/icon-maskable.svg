    <path d="M256 248 C220 236 170 236 120 248 C115 250 112 254 112 260 L112 360 C112 366 117 372 124 370 C168 358 214 360 256 376 Z" fill="#ffffff" />
    <path d="M256 248 C292 236 342 236 392 248 C397 250 400 254 400 260 L400 360 C400 366 395 372 388 370 C344 358 298 360 256 376 Z" fill="#f1f5f9" />
